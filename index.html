<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenStreetMap — Fullscreen NL (Leaflet)</title>

  <!-- Strakke CSP: alleen wat we nodig hebben -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src https://*.tile.openstreetmap.org data:; script-src https://unpkg.com 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self';">

  <style>
    /* ======= EIGEN CSS (geen externe styles) ======= */

    /* 1) Fullscreen canvas */
    :root { --gap: 0px; }
    html, body { height: 100%; margin: 0; padding: 0; }
    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh; /* beter op mobiel dan 100vh */
      background: #f2f2f2;
    }

    /* 2) Neutraliseer veelvoorkomende brekers van tiles */
    /*    (thema's zetten vaak globale img max-width/height, transform, zoom, filter, etc.) */
    .leaflet-container img { max-width: none !important; height: auto !important; }
    .leaflet-container, #map { transform: none !important; zoom: 1 !important; filter: none !important; }

    /* 3) Essentiële Leaflet layout (minimale, compatibele subset van leaflet.css) */
    .leaflet-container { -ms-touch-action: pan-x pan-y; touch-action: pan-x pan-y; outline: 0; }
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer { position: absolute; left: 0; top: 0; }

    .leaflet-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane { z-index: 500; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane { z-index: 700; }
    .leaflet-zoom-animated { transform-origin: 0 0; }

    /* Hard safeguard: exacte tile-afmetingen, voorkomt sub-pixel scaling */
    .leaflet-tile { width: 256px !important; height: 256px !important; }

    /* Controls – simpel en lichtgewicht */
    .leaflet-control-container { position: absolute; inset: 0; pointer-events: none; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; } .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; } .leaflet-right { right: 0; }
    .leaflet-control { pointer-events: auto; }

    .leaflet-bar {
      background: #fff; border-radius: 8px; overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
    }
    .leaflet-bar a {
      display: block; width: 34px; height: 34px; line-height: 34px;
      text-align: center; text-decoration: none; color: #111;
      font: 18px/34px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      border-bottom: 1px solid #ddd; background: #fff;
    }
    .leaflet-bar a:last-child { border-bottom: 0; }
    .leaflet-bar a:hover { background: #f6f6f6; }
    .leaflet-control-zoom { margin: 10px; }

    .leaflet-control-attribution {
      margin: 0 6px 6px 6px; padding: 3px 8px;
      background: rgba(255,255,255,.85); border-radius: 6px;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #111;
    }

    /* Touch-drag cursors (desktop feedback) */
    .leaflet-grab { cursor: grab; cursor: -webkit-grab; }
    .leaflet-dragging .leaflet-grab { cursor: grabbing; cursor: -webkit-grabbing; }

    /* iOS: voorkom rubber-band scroll in fullscreen map */
    body { overscroll-behavior: none; }
  </style>
</head>
<body>
  <div id="map" aria-label="OpenStreetMap-kaart van Nederland"></div>

  <!-- Leaflet JS (stabiel CDN). Wil je 0 externe JS? zeg het, dan inline ik 'm. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>

  <script>
    // 1) Kaart init
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    });

    // 2) Start op Nederland
    const nlBounds = L.latLngBounds([50.6, 3.1], [53.7, 7.3]);
    map.fitBounds(nlBounds, { padding: [20, 20] });

    // 3) OSM-tiles + correcte attribution
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      subdomains: ['a', 'b', 'c'],
      maxZoom: 19,
      minZoom: 0,
      tileSize: 256,
      detectRetina: false,           // geen extra tile load op OSM
      updateWhenIdle: true,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 4) Houd layout strak bij viewport-wijzigingen
    addEventListener('resize', () => map.invalidateSize({ debounceMoveend: true }));

    // 5) Fail-safe: check of tiles mogelijk geschaald zijn (dev warning)
    setTimeout(() => {
      const t = document.querySelector('.leaflet-tile');
      if (t && (t.naturalWidth && t.width !== 256)) {
        console.warn('Tile lijkt geschaald. Controleer externe CSS of browser-zoom.');
      }
    }, 1000);
  </script>
</body>
</html>
