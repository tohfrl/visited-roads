<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSM Fullscreen – Nederland (eigen CSS)</title>

  <style>
    /* ====== EIGEN CSS (GEEN EXTERNE STYLES) ====== */

    /* Volledig scherm */
    html, body { height: 100%; margin: 0; }
    #map { position: fixed; inset: 0; }

    /* Belangrijk: voorkom dat globale regels tiles schalen of verschuiven */
    .leaflet-container img { max-width: none !important; }
    .leaflet-tile { width: 256px !important; height: 256px !important; }

    /* Minimaal noodzakelijke Leaflet-layout (uitgeklede, compatibele subset) */
    .leaflet-container { background: #f2f2f2; outline: 0; }
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute; left: 0; top: 0;
    }
    .leaflet-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane { z-index: 500; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane { z-index: 700; }

    .leaflet-zoom-animated { transform-origin: 0 0; }
    .leaflet-zoom-box {
      width: 0; height: 0; box-sizing: border-box;
      z-index: 800; border: 2px dotted #38f; background: rgba(0,0,0,0.05);
    }

    /* Controls (basic look) */
    .leaflet-control-container { position: absolute; pointer-events: none; top: 0; left: 0; right: 0; bottom: 0; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top  { top: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
    .leaflet-right { right: 0; }

    .leaflet-control { pointer-events: auto; }
    .leaflet-bar {
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      border-radius: 6px; overflow: hidden; background: #fff;
    }
    .leaflet-bar a {
      display: block; text-align: center; text-decoration: none;
      width: 30px; height: 30px; line-height: 30px; font: 18px/30px sans-serif;
      color: #000; background: #fff; border-bottom: 1px solid #ccc;
    }
    .leaflet-bar a:last-child { border-bottom: 0; }
    .leaflet-bar a:hover { background: #f4f4f4; }

    .leaflet-control-zoom { margin: 10px; }
    .leaflet-control-attribution {
      margin: 0 5px 5px 5px;
      background: rgba(255,255,255,0.8);
      padding: 2px 6px; border-radius: 4px;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #111; pointer-events: auto;
    }

    /* Cursor feedback bij slepen/zoomen */
    .leaflet-grab { cursor: grab; cursor: -webkit-grab; }
    .leaflet-dragging .leaflet-grab { cursor: grabbing; cursor: -webkit-grabbing; }

    /* Voorkom dat een ouder-element de kaart schaalt of een nieuwe context maakt */
    #map, .leaflet-container { transform: none !important; zoom: 1 !important; filter: none !important; }
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="OpenStreetMap-kaart van Nederland"></div>

  <!-- Leaflet JS (alleen JS via CDN; desgewenst kan ik dit inline leveren) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="anonymous">
  </script>

  <script>
    // Kaart initialiseren
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    });

    // Start op Nederland
    const nlBounds = L.latLngBounds([50.6, 3.1], [53.7, 7.3]);
    map.fitBounds(nlBounds, { padding: [20, 20] });

    // OSM-tiles met correcte attribution (officiële server)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      subdomains: ['a','b','c'],
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Hertekenen bij resize
    addEventListener('resize', () => map.invalidateSize({ debounceMoveend: true }));
  </script>
</body>
</html>
