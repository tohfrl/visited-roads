<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Kaart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet CSS (belangrijk! zonder deze zie je “versnipperde” tiles) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAO8g3GIIk3Hn2V7Y2qLZQkKXJME3i2R3qM4Lr3w="
    crossorigin=""
  />

  <style>
    /* Volledig scherm */
    html, body, #map { height: 100%; margin: 0; }
    /* Optioneel: prettige achtergrond als tiles nog laden */
    .leaflet-container { background: #f2f2f2; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    // Startpositie (Groningen). Pas aan naar wens.
    const map = L.map('map').setView([53.2194, 6.5665], 11);

    // OpenStreetMap-tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
  </script>
</body>
</html>
